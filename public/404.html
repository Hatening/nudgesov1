<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · NudgeSo</title>
<link rel="icon" href="/favicon/favicon.ico">
<link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Asap:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--primary:#EE6E3A;--primary-dark:#C8541F;--primary-soft:#FDEBDD;--oat:#F3EAD8;--cream:#F7F4EC;--ink:#262B33;--muted:#5b6470;--line:#E7DFCF;}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;flex-direction:column;font-family:"Asap",ui-rounded,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:radial-gradient(900px 520px at 85% 12%,var(--oat) 0%,var(--cream) 60%);-webkit-font-smoothing:antialiased}
.wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 22px}
.logo{width:110px;height:auto;display:block;margin-bottom:18px}
h1{font-family:"Baloo 2","Asap",ui-rounded,sans-serif;font-size:34px;line-height:1.2;margin-bottom:10px}
p.sub{color:var(--muted);font-size:17px;max-width:440px;line-height:1.6;margin-bottom:30px}
.btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:14px 28px;border-radius:999px;font:inherit;font-size:16px;font-weight:700;text-decoration:none;cursor:pointer;border:2px solid var(--ink);background:#fff;color:var(--ink);transition:all .15s ease}
.btn:hover{background:var(--ink);color:#fff}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 8px 20px rgba(238,110,58,.28)}
.btn.primary:hover{background:var(--primary-dark);border-color:var(--primary-dark)}
.foot{text-align:center;color:var(--muted);font-size:13px;padding:20px}
@media(max-width:480px){h1{font-size:28px}.btn{width:100%;max-width:320px}}
</style>
</head>
<body>
  <main class="wrap">
    <img class="logo" src="/img/icon.png" alt="NudgeSo">
    <h1>Page not found · 找不到页面</h1>
    <p class="sub">The page you're looking for doesn't exist or was moved. Let's get you back on track.<br>你访问的地址不存在或已移动。</p>
    <div class="btns">
      <a class="btn primary" href="/landing.html">Back to home / 回首页</a>
      <a class="btn" href="/">Go to my dashboard / 回后台</a>
    </div>
  </main>
  <footer class="foot">NudgeSo · Calm Customer Support · www.nudgeso.com</footer>
</body>
</html>
