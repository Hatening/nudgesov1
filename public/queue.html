<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F3EAD8">
<script>(function(){try{if(!localStorage.getItem('relaydesk_token')){location.replace('/login.html?redirect='+encodeURIComponent(location.pathname+location.search));}}catch(e){}})();</script>
  <title>需要你处理的问题 · NudgeSo</title>
  <link rel="icon" href="/favicon/favicon.ico">
  <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png">
  <link rel="stylesheet" href="/fonts/fonts.css">
  <script src="/tailwind.vendor.js"></script>
  <link rel="stylesheet" href="/ui.css">
  <link rel="stylesheet" href="/queue.css">
</head>
<body data-page="queue">
  <header class="topbar">
    <a class="brand" href="/">
      <img src="/img/logo-lockup.png" alt="NudgeSo" style="height:46px;width:auto;display:block">
    </a>
    <a class="back-link" href="/">返回后台</a>
  </header>

  <main class="queue-page">
    <section class="page-head">
      <div>
        <h1>需要你处理的问题</h1>
        <p class="muted">客户的投诉、退款要求，还有系统拿不准怎么回的问题，都会出现在这里。看完一条、处理好一条就点一下「已处理」。</p>
      </div>
      <div class="head-actions">
        <button id="refreshButton" class="btn" type="button"><span class="ico"></span><span class="lbl">刷新一下</span></button>
        <span id="queueCount" class="count">0</span>
      </div>
    </section>

    <section id="queueError" class="notice error" role="alert"></section>

    <section id="emptyState" class="empty-state hidden">
      <span class="empty-ico" id="emptyIco"></span>
      <strong>现在没有要处理的问题</strong>
      <p>客户发来投诉或退款要求时，会出现在这里。</p>
      <a class="btn" href="/" style="margin-top:14px">返回后台 / Back to dashboard</a>
    </section>

    <section class="table-card">
      <table class="queue-table">
        <thead>
          <tr>
            <th>客户说的话</th>
            <th>店铺</th>
            <th>语言</th>
            <th>想问什么</th>
            <th>要紧程度</th>
            <th>状态</th>
            <th>时间</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="escalationRows"></tbody>
      </table>
    </section>

    <p class="footnote">这些都来自你自己店铺的客户消息。</p>
  </main>

  <script src="/icons.js"></script>
  <script>
  (function () {
    document.querySelector('#refreshButton .ico').innerHTML = window.NS_ICON('refresh', 20);
    document.getElementById('emptyIco').innerHTML = window.NS_ICON('check', 34);
  })();
  </script>
  <script src="/i18n.js" defer></script>
  <script src="/queue.js" defer></script>
</body>
</html>
