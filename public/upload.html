<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>上传专属资料 · RelayDesk</title>
<link rel="stylesheet" href="/styles.css">
<style>
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  .top{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:14px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800}
  .mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#6d6be5,#4544ba);color:#fff;display:grid;place-items:center}
  .top a{margin-left:auto;font-size:13px;font-weight:650;color:#5b5bd6;text-decoration:none}
  .wrap{max-width:900px;margin:0 auto;padding:26px 20px 60px}
  h1{font-size:26px;letter-spacing:-.6px;margin:0 0 6px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 20px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:22px;margin-bottom:18px}
  .drop{border:1.5px dashed #c9d1e0;border-radius:14px;padding:34px;text-align:center;color:#7b8798;background:#fbfcff;cursor:pointer;transition:.15s}
  .drop:hover,.drop.on{border-color:#5b5bd6;background:#f7f7ff;color:#4e4bc5}
  .drop strong{display:block;font-size:15px;margin-bottom:6px;color:#3b475a}
  .file-row{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:13px;color:#5f6b7e;background:#f4f6fa;border-radius:9px;padding:10px 12px}
  .file-row[hidden]{display:none}
  .btn{border:1px solid #e0e5ee;background:#fff;color:#46556b;border-radius:9px;padding:10px 16px;font:inherit;font-size:13px;font-weight:650;cursor:pointer}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .status{margin-top:14px;font-size:13px;padding:10px 12px;border-radius:10px;display:none}
  .status.ok{display:block;background:#eefaf3;color:#17845a;border:1px solid #d8f0e3}
  .status.err{display:block;background:#fff1f2;color:#b43743;border:1px solid #f6d9dc}
  .status.info{display:block;background:#f2f5ff;color:#4e4bc5;border:1px solid #e2e6ff}
  .confirm{border:1.5px solid #f0c987;background:#fffdf5;border-radius:14px;padding:18px;margin-top:16px}
  .confirm h3{margin:0 0 6px;font-size:15px;color:#8a5a12}
  .confirm p{margin:0 0 10px;font-size:12.5px;color:#8a6a3a}
  .confirm textarea{width:100%;min-height:160px;border:1px solid #e6d9bd;border-radius:10px;padding:12px;font:inherit;font-size:13.5px;line-height:1.6;box-sizing:border-box;background:#fff}
  .confirm-actions{display:flex;gap:10px;margin-top:12px}
  .cards{display:grid;gap:12px}
  .kcard{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#fff}
  .kcard h3{margin:0 0 6px;font-size:15px}
  .kcard p{margin:0 0 10px;color:#5f6b7e;font-size:13px;line-height:1.6;white-space:pre-wrap;max-height:120px;overflow:auto}
  .pill{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:3px 8px;background:#fff4e6;color:#b06a12;margin-right:6px}
  .pill.ok{background:#eefaf3;color:#17845a}
  .empty{color:#93a0b3;font-size:13px;text-align:center;padding:24px}
</style>
</head>
<body>
<div class="top">
  <div class="mark">R</div>
  <div class="brand">RelayDesk<small style="display:block;font-size:10px;color:#7b8798;font-weight:500">Seller knowledge upload</small></div>
  <a href="/">← 返回后台</a>
</div>
<div class="wrap">
  <h1>上传专属资料</h1>
  <p class="sub">支持 PDF / TXT / Markdown / 图片（PNG、JPG）。扫描件或图片会先走 OCR 识别，需你二次确认文字准确后再蒸馏入库。</p>

  <div class="card">
    <div class="drop" id="drop">
      <strong>点击选择文件，或拖拽到这里</strong>
      支持 .pdf / .txt / .md / .png / .jpg / .jpeg，单文件不超过 5MB
    </div>
    <input id="file" type="file" accept=".pdf,.txt,.md,.png,.jpg,.jpeg,application/pdf,text/plain,text/markdown,image/png,image/jpeg" hidden>
    <div class="file-row" id="fileRow" hidden><span id="fileName"></span><span id="fileSize" style="margin-left:auto;color:#93a0b3"></span></div>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn primary" id="upload" disabled>开始上传</button>
      <button class="btn" id="refresh">刷新已上传资料</button>
    </div>
    <div class="status" id="status"></div>
    <div class="confirm" id="confirmPanel" hidden>
      <h3>请二次确认 OCR 识别结果</h3>
      <p>系统已从图片中提取以下文字。请核对是否准确；可直接在下方修改，确认后再进入蒸馏与草稿入库流程。</p>
      <textarea id="ocrText" spellcheck="false"></textarea>
      <div class="confirm-actions">
        <button class="btn primary" id="confirmOcr">确认无误，继续蒸馏</button>
        <button class="btn" id="cancelOcr">取消</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h2 style="font-size:16px;margin:0 0 14px">我的知识卡（草稿需确认入库）</h2>
    <div class="cards" id="cards"><div class="empty">加载中…</div></div>
  </div>
</div>

<script src="/vendor/pdf.min.js"></script>
<script>
(function () {
  var TOKEN = localStorage.getItem('relaydesk_token') || '';
  if (!TOKEN) { location.href = '/'; return; }
  if (window.pdfjsLib) window.pdfjsLib.GlobalWorkerOptions.workerSrc = '/vendor/pdf.worker.min.js';

  var drop = document.getElementById('drop');
  var fileInput = document.getElementById('file');
  var fileRow = document.getElementById('fileRow');
  var fileName = document.getElementById('fileName');
  var fileSize = document.getElementById('fileSize');
  var uploadBtn = document.getElementById('upload');
  var refreshBtn = document.getElementById('refresh');
  var statusBox = document.getElementById('status');
  var cardsBox = document.getElementById('cards');
  var confirmPanel = document.getElementById('confirmPanel');
  var ocrText = document.getElementById('ocrText');
  var confirmBtn = document.getElementById('confirmOcr');
  var cancelBtn = document.getElementById('cancelOcr');
  var picked = null;
  var pendingFilename = '';

  function authHeaders(extra) {
    return Object.assign({ authorization: 'Bearer ' + TOKEN }, extra || {});
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function setStatus(text, kind) {
    statusBox.textContent = text;
    statusBox.className = 'status ' + (kind || '');
  }
  function choose(file) {
    picked = file;
    fileName.textContent = file.name;
    fileSize.textContent = (file.size / 1024).toFixed(1) + ' KB';
    fileRow.hidden = false;
    uploadBtn.disabled = false;
    confirmPanel.hidden = true;
  }
  drop.addEventListener('click', function () { fileInput.click(); });
  fileInput.addEventListener('change', function () { if (fileInput.files[0]) choose(fileInput.files[0]); });
  drop.addEventListener('dragover', function (e) { e.preventDefault(); drop.classList.add('on'); });
  drop.addEventListener('dragleave', function () { drop.classList.remove('on'); });
  drop.addEventListener('drop', function (e) {
    e.preventDefault(); drop.classList.remove('on');
    if (e.dataTransfer.files[0]) choose(e.dataTransfer.files[0]);
  });

  function readAsBase64(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () { resolve(String(reader.result)); };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }
  function readAsText(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () { resolve(String(reader.result || '')); };
      reader.onerror = reject;
      reader.readAsText(file);
    });
  }

  async function postJson(url, body) {
    var res = await fetch(url, {
      method: 'POST',
      headers: authHeaders({ 'content-type': 'application/json' }),
      body: JSON.stringify(body || {})
    });
    var data = await res.json().catch(function () { return {}; });
    return { ok: res.ok, status: res.status, data: data };
  }

  async function uploadText(text, filename) {
    return postJson('/api/v1/seller/knowledge/upload', { filename: filename, content: text });
  }

  // PDF 扫描件：用 pdf.js 渲染前 3 页为 PNG，再交给云端 OCR
  async function renderPdfPages(dataUrl) {
    var binary = atob(String(dataUrl).split(',')[1] || '');
    var bytes = new Uint8Array(binary.length);
    for (var k = 0; k < binary.length; k += 1) bytes[k] = binary.charCodeAt(k);
    var pdf = await window.pdfjsLib.getDocument({ data: bytes }).promise;
    var pages = Math.min(pdf.numPages, 3);
    var images = [];
    for (var i = 1; i <= pages; i += 1) {
      var page = await pdf.getPage(i);
      var viewport = page.getViewport({ scale: 1.6 });
      var canvas = document.createElement('canvas');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      await page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise;
      images.push(canvas.toDataURL('image/png'));
    }
    return images;
  }

  async function ocr(images) {
    return postJson('/api/v1/seller/knowledge/ocr', { images: images });
  }

  function showConfirm(text, filename) {
    pendingFilename = filename;
    ocrText.value = text;
    confirmPanel.hidden = false;
    confirmPanel.scrollIntoView({ behavior: 'smooth', block: 'center' });
    setStatus('OCR 完成，请在上方核对文字后点击「确认无误，继续蒸馏」。', 'info');
  }

  confirmBtn.addEventListener('click', async function () {
    var text = ocrText.value.trim();
    if (text.length < 10) { setStatus('识别文字太短，请补充后再确认。', 'err'); return; }
    confirmBtn.disabled = true;
    setStatus('正在调用模型蒸馏为知识卡…', 'info');
    try {
      var result = await uploadText(text, pendingFilename || 'scan.pdf');
      if (!result.ok) throw new Error(result.data.error || ('HTTP ' + result.status));
      setStatus('已生成 ' + result.data.items.length + ' 张草稿卡，请在下方确认入库。', 'ok');
      confirmPanel.hidden = true;
      await load();
    } catch (error) {
      setStatus('蒸馏失败：' + error.message, 'err');
    } finally {
      confirmBtn.disabled = false;
    }
  });
  cancelBtn.addEventListener('click', function () {
    confirmPanel.hidden = true;
    setStatus('已取消，未入库。你可以重新选择文件。', '');
  });

  uploadBtn.addEventListener('click', async function () {
    if (!picked) return;
    uploadBtn.disabled = true;
    setStatus('处理中…', 'info');
    try {
      var name = picked.name || 'upload';
      var isPdf = /\.pdf$/i.test(name) || picked.type === 'application/pdf';
      var isImage = /^image\//.test(picked.type) || /\.(png|jpe?g)$/i.test(name);

      if (isImage) {
        var imageUrl = await readAsBase64(picked);
        var ocrResult = await ocr([imageUrl]);
        if (!ocrResult.ok) throw new Error(ocrResult.data.error || ('OCR HTTP ' + ocrResult.status));
        showConfirm(ocrResult.data.text, name);
        return;
      }

      if (isPdf) {
        var pdfUrl = await readAsBase64(picked);
        var firstTry = await postJson('/api/v1/seller/knowledge/upload', { filename: name, file_base64: pdfUrl.split(',')[1] });
        if (firstTry.ok) {
          setStatus('PDF 文本层提取成功，已生成 ' + firstTry.data.items.length + ' 张草稿卡。', 'ok');
          await load();
          return;
        }
        if (firstTry.status === 422 && firstTry.data.code === 'NEEDS_OCR') {
          setStatus('检测到扫描件，正在渲染页面并调用云端 OCR…', 'info');
          var images = await renderPdfPages(pdfUrl);
          var scanned = await ocr(images);
          if (!scanned.ok) throw new Error(scanned.data.error || ('OCR HTTP ' + scanned.status));
          showConfirm(scanned.data.text, name);
          return;
        }
        throw new Error(firstTry.data.error || ('HTTP ' + firstTry.status));
      }

      // TXT / Markdown
      var text = await readAsText(picked);
      var result = await uploadText(text, name);
      if (!result.ok) throw new Error(result.data.error || ('HTTP ' + result.status));
      setStatus('已生成 ' + result.data.items.length + ' 张草稿卡（' + (result.data.provider || 'model') + '）。', 'ok');
      await load();
    } catch (error) {
      setStatus('处理失败：' + error.message, 'err');
    } finally {
      uploadBtn.disabled = false;
    }
  });

  refreshBtn.addEventListener('click', load);

  async function confirmCard(id) {
    try {
      var res = await fetch('/api/v1/seller/knowledge/' + encodeURIComponent(id) + '/confirm', {
        method: 'POST', headers: authHeaders({ 'content-type': 'application/json' }), body: '{}'
      });
      var data = await res.json().catch(function () { return {}; });
      if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
      setStatus('已确认入库：' + (data.item && data.item.title || id), 'ok');
      await load();
    } catch (error) {
      setStatus('确认失败：' + error.message, 'err');
    }
  }

  async function load() {
    try {
      var res = await fetch('/api/v1/seller/knowledge', { headers: authHeaders() });
      if (res.status === 401) { location.href = '/'; return; }
      var data = await res.json();
      var items = data.items || [];
      if (!items.length) { cardsBox.innerHTML = '<div class="empty">还没有上传资料。选择上方文件开始。</div>'; return; }
      cardsBox.innerHTML = items.map(function (item) {
        var draft = item.status !== 'confirmed';
        return '<div class="kcard"><h3>' + esc(item.title) + '</h3>'
          + '<p>' + esc(String(item.content || '').slice(0, 280)) + '</p>'
          + '<span class="pill' + (draft ? '' : ' ok') + '">' + esc(item.status) + '</span>'
          + (draft ? '<button class="btn" data-confirm="' + esc(item.id) + '" style="padding:6px 12px;font-size:12px">确认入库</button>' : '')
          + '</div>';
      }).join('');
      Array.prototype.forEach.call(cardsBox.querySelectorAll('[data-confirm]'), function (btn) {
        btn.addEventListener('click', function () { confirmCard(btn.getAttribute('data-confirm')); });
      });
    } catch (error) {
      cardsBox.innerHTML = '<div class="empty">加载失败：' + esc(error.message) + '</div>';
    }
  }

  // 后端返回 NEEDS_OCR 前，前端已通过 422 判定；占位请求仅用于兼容旧服务
  load();
})();
</script>
</body>
</html>
