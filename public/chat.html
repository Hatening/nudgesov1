<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F3EAD8">
  <title>NudgeSo Support</title>
  <link rel="icon" href="/favicon/favicon.ico">
  <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png">
  <link rel="stylesheet" href="/fonts/fonts.css">
  <script src="/tailwind.vendor.js"></script>
  <link rel="stylesheet" href="/ui.css">
  <link rel="stylesheet" href="/chat.css">
</head>
<body data-page="chat">
  <main class="chat-shell" id="chatShell">
    <header class="chat-header">
      <div class="chat-brand">
        <span class="chat-mark"><img src="/img/icon.png" alt="" style="height:36px;width:auto;display:block"></span>
        <span class="chat-brand-text">
          <strong id="siteName">店铺客服</strong>
          <small>NudgeSo · 客服消息</small>
        </span>
      </div>
      <span class="reply-note" id="replyNote"></span>
    </header>

    <section id="privacyPanel" class="chat-body" aria-labelledby="privacyTitle">
      <div class="lock" id="privacyLock"></div>
      <h1 id="privacyTitle">隐私提示</h1>
      <p id="privacyText">正在读取店铺信息…</p>
      <button id="consentButton" class="primary big-btn" type="button">同意并继续</button>
      <p class="privacy-foot">点了同意以后才开始聊天。</p>
      <p id="privacyError" class="error" role="alert"></p>
    </section>

    <section id="chatPanel" class="chat hidden" aria-label="Customer support conversation">
      <div id="messages" class="messages" aria-live="polite">
        <div class="message" data-role="agent" data-segment="welcome">你好，欢迎来咨询。你有什么问题尽管说，我们会用店里的资料尽快回答。<small class="message-meta">NudgeSo · 自动欢迎</small></div>
      </div>
      <div class="calm-note" id="calmNote"></div>
      <form id="composer" class="composer">
        <button id="voiceButton" class="voice-btn" type="button" disabled><span class="ico"></span><span class="lbl">语音</span></button>
        <button id="uploadVoiceButton" class="voice-btn" type="button" disabled><span class="ico"></span><span class="lbl">上传录音</span></button>
        <input id="voiceFile" type="file" accept=".wav,audio/wav" class="hidden">
        <input id="messageInput" class="composer-input" type="text" autocomplete="off" placeholder="输入消息…" maxlength="12000" disabled>
        <button id="sendButton" class="send-btn" type="submit" disabled><span class="ico"></span><span class="lbl">发送</span></button>
      </form>
      <p class="composer-hint">语音用不了的时候，可以打字，也可以上传一段 .wav 录音。</p>
      <p id="chatError" class="error" role="alert"></p>
    </section>

    <footer class="chat-footer">NudgeSo · 我们会尽快回复你</footer>
  </main>

  <script src="/icons.js"></script>
  <script>
  // 内联填充图标（mic 不在共享图标集里，本页自绘）
  (function () {
    var MIC = '<svg class="ns-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a2.5 2.5 0 0 1 2.5 2.5v5a2.5 2.5 0 0 1-5 0v-5A2.5 2.5 0 0 1 12 3z"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><path d="M12 17.5V21"/></svg>';
    document.getElementById('privacyLock').innerHTML = window.NS_ICON('shield', 26);
    document.getElementById('replyNote').innerHTML = window.NS_ICON('clock', 18) + '<span>通常几小时内回复，不用一直等</span>';
    document.getElementById('calmNote').innerHTML = window.NS_ICON('clock', 18) + '<span>我们通常会在几小时内回复，你不用一直等在这里。</span>';
    document.querySelector('#voiceButton .ico').outerHTML = MIC;
    document.querySelector('#uploadVoiceButton .ico').innerHTML = window.NS_ICON('paperclip', 20);
    document.querySelector('#sendButton .ico').innerHTML = window.NS_ICON('send', 20);
  })();
  </script>
  <script src="/i18n.js" defer></script>
  <script src="/chat.js" defer></script>
</body>
</html>
