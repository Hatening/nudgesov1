<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>对你有用的开店建议 · NudgeSo</title>
<script>(function(){try{if(!localStorage.getItem('relaydesk_token')){location.replace('/login.html?redirect='+encodeURIComponent(location.pathname+location.search));}}catch(e){}})();</script>
<meta name="description" content="NudgeSo 每周整理的开店小建议：广告、平台规则、进货和卖货的实用做法。">
<link rel="icon" href="/favicon/favicon.ico">
<link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
  :root{
    --oat:#F3EAD8; --cream:#F7F4EC; --ink:#262B33; --muted:#5b6470; --line:#E7DFCF;
    --primary:#B84A1D; --primary-dark:#9A3B10; --primary-soft:#FDEBDD; --amber:#E8923A; --green:#18A874;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--oat);color:var(--ink);font-family:"Asap","Baloo 2",ui-rounded,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:17px;line-height:1.7}
  h1,h2,h3{font-family:"Baloo 2","Asap",ui-rounded,sans-serif;line-height:1.28}
  a{color:inherit;text-decoration:none}

  .top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1.5px solid var(--line)}
  .top-in{max-width:1180px;margin:0 auto;padding:0 20px;min-height:68px;display:flex;align-items:center;gap:22px}
  .brand{display:flex;align-items:center;gap:10px;color:var(--primary)}
  .brand b{font-family:"Baloo 2",sans-serif;font-size:20px;color:var(--ink)}
  .brand small{display:block;font-size:12.5px;color:var(--muted);font-weight:500}
  .nav{display:flex;gap:6px}
  .nav a{padding:10px 14px;border-radius:12px;font-size:16px;color:var(--muted);font-weight:600}
  .nav a:hover{background:var(--cream);color:var(--ink)}
  .nav a.on{background:var(--primary-soft);color:var(--primary-dark)}
  .top-cta{margin-left:auto;display:flex;align-items:center;gap:10px}
  .btn{border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:14px;padding:12px 18px;font:inherit;font-size:16.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;min-height:48px}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 6px 14px rgba(184,74,29,.26)}
  .btn.primary:hover{background:var(--primary-dark)}

  /* 广告位：明确标注、与真实建议视觉分开 */
  .ad-leaderboard{margin:24px auto 0;max-width:728px}
  .ad-label{display:block;text-align:center;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin-bottom:6px}
  .ad-slot{border:1.5px dashed #CFC4AC;border-radius:16px;background:repeating-linear-gradient(45px,#FBF8F1,#FBF8F1 12px,#F3EDDF 12px,#F3EDDF 24px);display:grid;place-items:center;color:var(--muted);font-size:14px;text-align:center;padding:12px}
  .ad-728{width:100%;height:90px}
  .ad-300{width:100%;max-width:300px;height:250px;margin:0 auto}

  .wrap{max-width:1180px;margin:0 auto;padding:0 20px 64px}
  .hero{padding:38px 0 10px}
  .hero h1{margin:0 0 10px;font-size:38px;font-weight:700}
  .hero p{margin:0;max-width:600px;color:var(--muted);font-size:18px}
  .chips{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0 0}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:10px 18px;font-size:16px;font-weight:600;color:var(--muted);cursor:pointer;min-height:48px}
  .chip.on{background:var(--primary);border-color:var(--primary);color:#fff}

  .layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start;margin-top:26px}
  .cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
  .card{background:#fff;border:1.5px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 6px 18px rgba(38,43,51,.05);display:flex;flex-direction:column;gap:10px}
  .card-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .tag{display:inline-flex;align-items:center;padding:5px 12px;border-radius:999px;font-size:14px;font-weight:700}
  .tag.insight{background:var(--primary-soft);color:var(--primary-dark)}
  .tag.strategy{background:#E2F5EC;color:#137A56}
  .date{font-size:14px;color:var(--muted);white-space:nowrap}
  .card h2{margin:0;font-size:21px;line-height:1.4}
  .card p{margin:0;color:var(--muted);font-size:16.5px;line-height:1.7}
  .card-foot{margin-top:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-top:6px}
  .mini{font-size:13.5px;color:var(--muted);background:var(--cream);border-radius:8px;padding:4px 10px}
  .more{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-size:15.5px;font-weight:700;color:var(--primary-dark)}
  .more svg{width:18px;height:18px}

  .side{display:flex;flex-direction:column;gap:18px;position:sticky;top:86px}
  .side-card{background:#fff;border:1.5px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 6px 18px rgba(38,43,51,.05)}
  .side-card h3{margin:0 0 10px;font-size:18px}
  .hot{display:flex;flex-wrap:wrap;gap:8px}
  .hot span{font-size:14.5px;color:var(--muted);background:var(--cream);border-radius:999px;padding:6px 12px}
  .subscribe p{margin:0 0 12px;color:var(--muted);font-size:15.5px}
  .subscribe input{width:100%;box-sizing:border-box;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;font:inherit;font-size:16.5px;margin-bottom:10px;min-height:50px}
  .subscribe .btn{width:100%;justify-content:center;min-height:52px}

  .state{padding:44px 20px;text-align:center;color:var(--muted);font-size:16.5px;background:#fff;border:1.5px solid var(--line);border-radius:22px}
  .skeleton{height:210px;border-radius:22px;background:linear-gradient(100deg,#efe7d4 30%,#f7f1e2 50%,#efe7d4 70%);background-size:220% 100%;animation:sh 1.2s infinite}
  @keyframes sh{0%{background-position:120% 0}100%{background-position:-40% 0}}

  .foot{border-top:1.5px solid var(--line);background:#fff}
  .foot-in{max-width:1180px;margin:0 auto;padding:22px 20px;display:flex;justify-content:space-between;gap:16px;color:var(--muted);font-size:14px;flex-wrap:wrap}

  @media(max-width:980px){
    .layout{grid-template-columns:1fr}
    .side{position:static}
    .cards{grid-template-columns:1fr}
    .hero h1{font-size:30px}
    .nav{display:none}
  }
  @media(max-width:560px){
    .top-in{padding:10px 16px;min-height:0;flex-wrap:wrap}
    .top-cta{width:100%;margin-left:0;justify-content:flex-start;flex-wrap:wrap;gap:8px}
    .top-cta .btn{padding:9px 12px;font-size:14px;min-height:44px}
    .wrap{padding:0 16px 48px}
    .ad-leaderboard{margin-top:16px}
  }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="/">
      <img src="/img/logo-lockup.png" alt="NudgeSo" style="height:44px;width:auto;display:block">
    </a>
    <nav class="nav">
      <a class="on" href="/insights.html">全部</a>
      <a href="/insights.html?category=行业洞察">行业洞察</a>
      <a href="/insights.html?category=商业策略">商业策略</a>
    </nav>
    <div class="top-cta">
      <a class="btn" href="/">回到后台</a>
      <a class="btn primary" href="/onboarding.html">免费试试 NudgeSo</a>
    </div>
  </div>
</header>

<main class="wrap">
  <!-- 顶部横幅广告位 728×90 -->
  <div class="ad-leaderboard">
    <span class="ad-label">Sponsored · 广告</span>
    <div class="ad-slot ad-728" data-ad-slot="728x90">
      <!-- AdSense 审核通过后，把 <ins> 与 push 脚本取消注释：
      <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
           data-ad-slot="0000000000" data-ad-format="auto" data-full-width-responsive="true"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
      -->
    </div>
  </div>

  <section class="hero">
    <h1>对你有用的开店建议</h1>
    <p>广告怎么省、平台规则怎么变、进货和发货怎么安排——都是开店的人真正用得上的做法。</p>
    <div class="chips" id="filters">
      <button class="chip on" data-cat="all">全部</button>
      <button class="chip" data-cat="行业洞察">行业洞察</button>
      <button class="chip" data-cat="商业策略">商业策略</button>
    </div>
  </section>

  <div class="layout">
    <section>
      <div class="cards" id="cards">
        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      </div>
      <div class="state" id="state" hidden></div>
    </section>

    <aside class="side">
      <div class="side-card">
        <h3>赞助内容</h3>
        <span class="ad-label" style="text-align:left">Sponsored · 广告</span>
        <!-- 侧边栏广告位 300×250 -->
        <div class="ad-slot ad-300" data-ad-slot="300x250">
          <!-- AdSense 审核通过后取消注释：
          <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
               data-ad-slot="0000000000" data-ad-format="rectangle" data-full-width-responsive="false"></ins>
          <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
          -->
        </div>
      </div>

      <div class="side-card">
        <h3>大家在聊</h3>
        <div class="hot">
          <span>广告花费</span><span>平台规则</span><span>选品</span><span>独立站</span>
          <span>内容电商</span><span>进货</span><span>发货</span><span>退货率</span>
        </div>
      </div>

      <div class="side-card subscribe">
        <h3>每周一封开店建议</h3>
        <p>平台有什么新变化、钱该怎么花，周一早上发给你。</p>
        <input id="email" type="email" placeholder="you@example.com" autocomplete="email" aria-label="邮箱">
        <button class="btn" id="subscribe">订阅</button>
      </div>
    </aside>
  </div>
</main>

<footer class="foot">
  <div class="foot-in">
    <span>© 2026 NudgeSo · www.nudgeso.com</span>
    <span>内容仅供参考，不是平台官方政策</span>
  </div>
</footer>

<!-- AdSense 主脚本：审核通过后取消注释，并在 server.js 的 CSP 中放行
     https://pagead2.googlesyndication.com https://googleads.g.doubleclick.net
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
-->

<script src="/icons.js"></script>
<script>
(function () {
  var cards = document.getElementById('cards');
  var state = document.getElementById('state');
  var filters = document.getElementById('filters');
  var all = [];
  var categories = ['all', '行业洞察', '商业策略'];
  function categoryFromUrl() {
    var value = new URLSearchParams(location.search).get('category') || 'all';
    return categories.indexOf(value) >= 0 ? value : 'all';
  }
  var active = categoryFromUrl();

  function writeFilterUrl(cat, mode) {
    var url = new URL(location.href);
    if (cat === 'all') url.searchParams.delete('category');
    else url.searchParams.set('category', cat);
    var next = url.pathname + url.search + url.hash;
    if (mode === 'push') history.pushState({ category: cat }, '', next);
    else if (mode === 'replace') history.replaceState({ category: cat }, '', next);
  }


  function esc(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function fmtDate(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function render() {
    var list = active === 'all' ? all : all.filter(function (x) { return x.category === active; });
    if (!list.length) {
      cards.innerHTML = '';
      state.hidden = false;
      state.textContent = all.length
        ? '这个分类下暂时没有文章，换个分类看看。'
        : '新文章正在整理中，过几天再来看看。';
      return;
    }
    state.hidden = true;
    cards.innerHTML = list.map(function (item) {
      var cls = item.category === '商业策略' ? 'strategy' : 'insight';
      var tags = (item.tags || []).slice(0, 3).map(function (t) { return '<span class="mini">' + esc(t) + '</span>'; }).join('');
      return '<article class="card">'
        + '<div class="card-top"><span class="tag ' + cls + '">' + esc(item.category) + '</span>'
        + '<span class="date">' + fmtDate(item.created_at) + '</span></div>'
        + '<h2>' + esc(item.title) + '</h2>'
        + '<p>' + esc(item.summary) + '</p>'
        + '<div class="card-foot">' + tags + '<a class="more" href="/insight.html?id=' + encodeURIComponent(item.id) + '">看全文' + window.NS_ICON('chevron-right', 18) + '</a></div>'
        + '</article>';
    }).join('');
  }

  function setFilter(cat, mode) {
    active = categories.indexOf(cat) >= 0 ? cat : 'all';
    Array.prototype.forEach.call(filters.querySelectorAll('.chip'), function (chip) {
      chip.classList.toggle('on', chip.dataset.cat === active);
    });
    writeFilterUrl(active, mode);
    render();
  }

  filters.addEventListener('click', function (event) {
    var chip = event.target.closest('.chip');
    if (chip) setFilter(chip.dataset.cat, 'push');
  });
  window.addEventListener('popstate', function () {
    setFilter(categoryFromUrl(), 'none');
  });

  var subscribe = document.getElementById('subscribe');
  subscribe.addEventListener('click', function () {
    var email = document.getElementById('email').value.trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
      subscribe.textContent = '请先填一个能收信的邮箱';
      setTimeout(function () { subscribe.textContent = '订阅'; }, 1800);
      return;
    }
    subscribe.textContent = '订阅成功';
    subscribe.disabled = true;
  });

  fetch('/api/insights?limit=24')
    .then(function (response) {
      if (!response.ok) throw new Error('HTTP ' + response.status);
      return response.json();
    })
    .then(function (data) {
      all = Array.isArray(data.items) ? data.items : [];
      setFilter(active, 'replace');
    })
    .catch(function (error) {
      cards.innerHTML = '';
      state.hidden = false;
      state.textContent = '文章加载失败：' + error.message;
    });
})();
</script>
</body>
</html>
