<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>开店建议 · NudgeSo</title>
<script>(function(){try{if(!localStorage.getItem('relaydesk_token')){location.replace('/login.html?redirect='+encodeURIComponent(location.pathname+location.search));}}catch(e){}})();</script>
<meta name="description" content="NudgeSo 整理的开店小建议。">
<link rel="icon" href="/favicon/favicon.ico">
<link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png">
<style>
  :root{
    --oat:#F3EAD8; --cream:#F7F4EC; --ink:#262B33; --muted:#5b6470; --line:#E7DFCF;
    --primary:#B84A1D; --primary-dark:#9A3B10; --primary-soft:#FDEBDD;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--oat);color:var(--ink);font-family:"Asap","Baloo 2",ui-rounded,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:18px;line-height:1.8}
  h1,h2,h3{font-family:"Baloo 2","Asap",ui-rounded,sans-serif;line-height:1.3}
  a{color:inherit;text-decoration:none}
  .top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1.5px solid var(--line)}
  .top-in{max-width:900px;margin:0 auto;padding:0 20px;min-height:68px;display:flex;align-items:center;gap:12px}
  .brand{display:flex;align-items:center;gap:10px;color:var(--primary)}
  .brand b{font-family:"Baloo 2",sans-serif;font-size:20px;color:var(--ink)}
  .back{margin-left:auto;display:inline-flex;align-items:center;gap:6px;min-height:48px;padding:0 16px;border:1.5px solid var(--line);border-radius:14px;background:#fff;font-size:15.5px;font-weight:600;color:var(--muted)}
  .back:hover{border-color:var(--primary);background:var(--primary-soft);color:var(--primary-dark)}
  .wrap{max-width:820px;margin:0 auto;padding:32px 20px 24px}
  .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .tag{display:inline-flex;align-items:center;padding:5px 12px;border-radius:999px;font-size:14px;font-weight:700}
  .tag.insight{background:var(--primary-soft);color:var(--primary-dark)}
  .tag.strategy{background:#E2F5EC;color:#137A56}
  .date{font-size:14.5px;color:var(--muted)}
  h1{font-size:34px;margin:0 0 12px}
  .lead{color:var(--muted);font-size:17px;margin:0 0 22px}
  .article{background:#fff;border:1.5px solid var(--line);border-radius:24px;padding:34px 38px;box-shadow:0 8px 24px rgba(38,43,51,.06);font-size:18px;line-height:1.8;color:#333A45}
  .article h1,.article h2,.article h3{margin:26px 0 12px;color:var(--ink)}
  .article h2{font-size:24px}
  .article h3{font-size:20px}
  .article p{margin:0 0 16px}
  .article ul,.article ol{margin:0 0 16px;padding-left:24px}
  .article li{margin:6px 0}
  .article blockquote{margin:18px 0;padding:12px 18px;background:var(--primary-soft);border-left:4px solid var(--primary);color:#7A5A2A;border-radius:0 14px 14px 0}
  .article code{background:var(--cream);padding:2px 6px;border-radius:6px;font-size:.92em}
  .article pre{background:#262B33;color:#F3EAD8;padding:16px;border-radius:14px;overflow:auto}
  .article pre code{background:transparent;padding:0;color:inherit}
  .article img{max-width:100%;border-radius:14px}
  .article hr{border:0;border-top:1.5px solid var(--line);margin:26px 0}
  .article a{color:var(--primary-dark);text-decoration:underline}
  .tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:26px;padding-top:20px;border-top:1.5px solid var(--line)}
  .tags span{font-size:14.5px;color:var(--muted);background:var(--cream);border-radius:999px;padding:6px 12px}
  .ad-bottom{margin:28px 0 8px}
  .ad-label{display:block;text-align:center;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin-bottom:6px}
  .ad-slot{border:1.5px dashed #CFC4AC;border-radius:16px;background:repeating-linear-gradient(45deg,#FBF8F1,#FBF8F1 12px,#F3EDDF 12px,#F3EDDF 24px);display:grid;place-items:center;color:var(--muted);font-size:14px;min-height:90px;text-align:center;padding:12px}
  .state{padding:48px 20px;text-align:center;color:var(--muted);font-size:17px;background:#fff;border:1.5px solid var(--line);border-radius:24px}
  .foot{border-top:1.5px solid var(--line);background:#fff;margin-top:30px}
  .foot-in{max-width:900px;margin:0 auto;padding:22px 20px;display:flex;justify-content:space-between;gap:16px;color:var(--muted);font-size:14px;flex-wrap:wrap}
  @media(max-width:640px){
    .wrap{padding:22px 16px}
    h1{font-size:27px}
    .article{padding:22px 20px}
  }
</style>
<link rel="stylesheet" href="/fonts/fonts.css">
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="/insights.html"><img src="/img/logo-lockup.png" alt="NudgeSo" style="height:44px;width:auto;display:block"></a>
    <a class="back" href="/insights.html" id="backList">返回列表</a>
  </div>
</header>

<main class="wrap" id="main">
  <div class="state" id="state">正在打开…</div>
  <article id="article" hidden>
    <div class="meta" id="meta"></div>
    <h1 id="title"></h1>
    <p class="lead" id="lead"></p>
    <div class="article" id="body"></div>
    <div class="tags" id="tags"></div>
    <div class="ad-bottom">
      <span class="ad-label">Sponsored · 广告</span>
      <!-- 正文底部广告位 -->
      <div class="ad-slot" data-ad-slot="article-bottom">
        <!-- AdSense 审核通过后取消注释：
        <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
             data-ad-slot="0000000000" data-ad-format="auto" data-full-width-responsive="true"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        -->
      </div>
    </div>
  </article>
</main>

<footer class="foot">
  <div class="foot-in">
    <span>© 2026 NudgeSo · www.nudgeso.com</span>
    <span>内容仅供参考，不是平台官方政策</span>
  </div>
</footer>

<script src="/icons.js"></script>
<script>
(function () {
  document.getElementById('backList').insertAdjacentHTML('afterbegin', window.NS_ICON('chevron-right', 18));
})();
</script>
<script src="/vendor/marked.min.js"></script>
<script>
(function () {
  var state = document.getElementById('state');
  var article = document.getElementById('article');
  var params = new URLSearchParams(location.search);
  var id = params.get('id');

  function esc(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmtDate(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function fail(message) {
    state.hidden = false;
    state.textContent = message;
    article.hidden = true;
  }

  if (!id) return fail('没有找到文章编号，请从列表页进来。');

  fetch('/api/insights/' + encodeURIComponent(id))
    .then(function (r) {
      if (r.status === 404) throw new Error('文章不存在或已下线');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (data) {
      var item = data.item;
      document.title = item.title + ' · NudgeSo 开店建议';
      document.getElementById('meta').innerHTML =
        '<span class="tag ' + (item.category === '商业策略' ? 'strategy' : 'insight') + '">' + esc(item.category) + '</span>'
        + '<span class="date">' + fmtDate(item.created_at) + '</span>';
      document.getElementById('title').textContent = item.title;
      document.getElementById('lead').textContent = (item.tags || []).join(' · ');
      document.getElementById('tags').innerHTML = (item.tags || []).map(function (t) { return '<span>' + esc(t) + '</span>'; }).join('');

      var raw = String(item.content || '')
        .replace(/<script[\s\S]*?<\/script>/gi, '')
        .replace(/<style[\s\S]*?<\/style>/gi, '');
      function escHtml(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }
      var html;
      if (window.marked && window.marked.parse) {
        html = window.marked.parse(raw, { gfm: true, breaks: false });
      } else {
        // marked.min.js unavailable: one-shot HTML escape, then safe minimal markdown
        html = escHtml(raw)
          .split(/\n{2,}/)
          .map(function (para) {
            var p = para.trim().replace(/\n/g, '<br>');
            p = p.replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
            p = p.replace(/\*/g, '');
            return '<p>' + p + '</p>';
          }).join('');
      }
      document.getElementById('body').innerHTML = html;
      state.hidden = true;
      article.hidden = false;
    })
    .catch(function (error) {
      fail('打开失败：' + error.message);
    });
})();
</script>
</body>
</html>
