<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RelayDesk Insights · 文章</title>
<meta name="description" content="跨境电商行业洞察与商业策略文章详情。">
<style>
  :root{
    --bg:#f6f8fc; --panel:#fff; --ink:#1e293b; --muted:#7b8798; --line:#e8edf4;
    --primary:#5b5bd6; --primary-soft:#f0efff; --teal:#0f9b8e; --teal-soft:#eaf8f5;
    --shadow:0 4px 18px rgba(22,34,56,.045);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.75}
  a{color:inherit;text-decoration:none}
  .top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .top-in{max-width:1080px;margin:0 auto;padding:0 24px;height:64px;display:flex;align-items:center;gap:26px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.4px}
  .brand-mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#6d6be5,#4544ba);color:#fff;display:grid;place-items:center;font-size:17px}
  .brand small{display:block;font-size:10px;color:var(--muted);font-weight:500}
  .back{margin-left:auto;font-size:13px;font-weight:650;color:#5b5bd6}
  .wrap{max-width:820px;margin:0 auto;padding:36px 24px 20px}
  .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .tag{display:inline-flex;align-items:center;padding:4px 10px;border-radius:7px;font-size:11px;font-weight:750}
  .tag.insight{background:var(--primary-soft);color:#5552c9}
  .tag.strategy{background:var(--teal-soft);color:#0f8a7e}
  .date{font-size:12px;color:#a3adbc}
  h1{font-size:34px;line-height:1.3;letter-spacing:-1px;margin:0 0 10px}
  .lead{color:#6f7c90;font-size:15px;margin:0 0 22px}
  .article{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:34px 38px;box-shadow:var(--shadow);font-size:16px;line-height:1.85;color:#334155}
  .article h1,.article h2,.article h3{margin:26px 0 12px;line-height:1.35;letter-spacing:-.3px;color:#1f2b3d}
  .article h2{font-size:23px}
  .article h3{font-size:18px}
  .article p{margin:0 0 16px}
  .article ul,.article ol{margin:0 0 16px;padding-left:24px}
  .article li{margin:6px 0}
  .article blockquote{margin:18px 0;padding:12px 18px;background:#f8f9ff;border-left:3px solid #b9b8f0;color:#5b6480;border-radius:0 10px 10px 0}
  .article code{background:#f4f6fa;padding:2px 6px;border-radius:5px;font-size:.9em}
  .article pre{background:#1e2638;color:#cbd5e1;padding:16px;border-radius:10px;overflow:auto}
  .article pre code{background:transparent;padding:0;color:inherit}
  .article img{max-width:100%;border-radius:12px}
  .article hr{border:0;border-top:1px solid var(--line);margin:26px 0}
  .article a{color:#5552c9;text-decoration:underline}
  .tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:26px;padding-top:20px;border-top:1px solid var(--line)}
  .tags span{font-size:12px;color:#6b7790;background:#f4f6fa;border-radius:7px;padding:5px 10px}
  .ad-bottom{margin:26px 0 8px}
  .ad-slot{border:1px dashed #c9d1e0;border-radius:12px;background:repeating-linear-gradient(45deg,#fbfcff,#fbfcff 10px,#f5f7fc 10px,#f5f7fc 20px);display:grid;place-items:center;color:#9aa5b8;font-size:12px;min-height:90px;text-align:center;padding:10px}
  .ad-slot.tall{min-height:250px;max-width:336px;margin:0 auto}
  .ad-note{text-align:center;color:#a9b2c1;font-size:10px;margin-top:6px}
  .state{padding:40px;text-align:center;color:#93a0b3;font-size:14px;background:#fff;border:1px solid var(--line);border-radius:18px}
  .foot{border-top:1px solid var(--line);background:#fff;margin-top:30px}
  .foot-in{max-width:1080px;margin:0 auto;padding:22px 24px;display:flex;justify-content:space-between;gap:16px;color:#93a0b3;font-size:12px;flex-wrap:wrap}
  @media(max-width:640px){
    .wrap{padding:24px 16px}
    h1{font-size:26px}
    .article{padding:22px 20px;font-size:15px}
    .top-in{padding:0 16px}
  }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="/insights.html"><span class="brand-mark">◈</span><span>RelayDesk<small>Insights · 行业洞察</small></span></a>
    <a class="back" href="/insights.html">← 返回列表</a>
  </div>
</header>

<main class="wrap" id="main">
  <div class="state" id="state">加载中…</div>
  <article id="article" hidden>
    <div class="meta" id="meta"></div>
    <h1 id="title"></h1>
    <p class="lead" id="lead"></p>
    <div class="article" id="body"></div>
    <div class="tags" id="tags"></div>
    <div class="ad-bottom">
      <!-- 正文底部广告位 728×90 / 自适应：转化最高的位置 -->
      <div class="ad-slot" data-ad-slot="article-bottom">
        <!-- AdSense 审核通过后取消注释：
        <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
             data-ad-slot="0000000000" data-ad-format="auto" data-full-width-responsive="true"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        -->
        广告位 728×90 · Advertisement
      </div>
      <div class="ad-note">广告由 Google AdSense 提供</div>
    </div>
  </article>
</main>

<footer class="foot">
  <div class="foot-in">
    <span>© 2026 RelayDesk · 跨境电商 AI 客服</span>
    <span>内容仅供行业参考，不构成平台官方政策</span>
  </div>
</footer>

<script src="/vendor/marked.min.js"></script>
<script>
(function () {
  var state = document.getElementById('state');
  var article = document.getElementById('article');
  var params = new URLSearchParams(location.search);
  var id = params.get('id');

  function esc(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmtDate(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function fail(message) {
    state.hidden = false;
    state.textContent = message;
    article.hidden = true;
  }

  if (!id) return fail('缺少文章 ID，请从列表页进入。');

  fetch('/api/insights/' + encodeURIComponent(id))
    .then(function (r) {
      if (r.status === 404) throw new Error('文章不存在或已下线');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (data) {
      var item = data.item;
      document.title = item.title + ' · RelayDesk Insights';
      document.getElementById('meta').innerHTML =
        '<span class="tag ' + (item.category === '商业策略' ? 'strategy' : 'insight') + '">' + esc(item.category) + '</span>'
        + '<span class="date">' + fmtDate(item.created_at) + '</span>';
      document.getElementById('title').textContent = item.title;
      document.getElementById('lead').textContent = (item.tags || []).join(' · ');
      document.getElementById('tags').innerHTML = (item.tags || []).map(function (t) { return '<span>' + esc(t) + '</span>'; }).join('');

      var source = String(item.content || '')
        .replace(/<script[\s\S]*?<\/script>/gi, '')
        .replace(/<style[\s\S]*?<\/style>/gi, '')
        .replace(/</g, '&lt;');
      var html = (window.marked && window.marked.parse)
        ? window.marked.parse(source, { gfm: true, breaks: false })
        : '<p>' + esc(source).replace(/\n/g, '<br>') + '</p>';
      document.getElementById('body').innerHTML = html;
      state.hidden = true;
      article.hidden = false;
    })
    .catch(function (error) {
      fail('加载失败：' + error.message);
    });
})();
</script>
</body>
</html>
